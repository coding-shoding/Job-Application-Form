<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Portal</title>
    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>
<body>

<div class="main-center">

    <div class="form-container" id="registration-container">
        <img
            src="REG.png"
            alt="Registration Image"
            class="form-img"
        />

        <form
            id="registrationform"
            enctype="multipart/form-data"
            novalidate
        >

            <div class="form-header">
                <h2 class="form-title">Register to Access the Job Application Form</h2>
                <p class="form-desc">
                    Please provide your details below. Fields marked with * are required.
                </p>
            </div>

            <label for="fullname" class="form-label">Full Name*</label>
            <input
                type="text"
                name="fullname"
                id="fullname"
                class="form-input"
                placeholder="Enter your full name"
            >
            <span class="error-msg" id="fullname-error"></span>

            <label for="email" class="form-label">Email Address*</label>
            <input
                type="email"
                name="email"
                id="email"
                class="form-input"
                placeholder="Enter your email"
            >
            <span class="error-msg" id="email-error"></span>

            <label for="phone" class="form-label">Phone Number*</label>
            <input
                type="tel"
                name="phone"
                id="phone"
                class="form-input"
                maxlength="10"
                placeholder="Enter your phone number"
            >
            <span class="error-msg" id="phone-error"></span>

            <label for="password" class="form-label">Password*</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-input"
                    placeholder="Enter your password"
                >
                <i class="fa-solid fa-eye toggle-eye" id="toggle-password" data-target="password"></i>
            </div>
            <span class="error-msg" id="password-error"></span>

            <label for="confirm-password" class="form-label">Confirm Password*</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    name="confirm-password"
                    id="confirm-password"
                    class="form-input"
                    placeholder="Confirm your password"
                >
                <i class="fa-solid fa-eye toggle-eye" id="toggle-confirm-password" data-target="confirm-password"></i>
            </div>
            <span class="error-msg" id="confirm-password-error"></span>

            <div class="form-checkbox-row">
                <input
                    type="checkbox"
                    id="declaration"
                    class="form-checkbox"
                >
                <label for="declaration" class="form-label checkbox-label">
                    I agree to the Terms & Conditions.
                </label>
            </div>
            <span class="error-msg" id="declaration-error"></span>

            <button type="submit" class="form-btn">
                Register
            </button>

        </form>
    </div>

    <div class="form-container hidden" id="jobform-container">

        <form id="jobapplicationform" enctype="multipart/form-data" novalidate>

            <div class="form-header">
                <h2 class="form-title">Job Application Form</h2>
                <p class="form-desc">
                    Great! Your account is verified. Please fill in your application details below.
                </p>
            </div>

            <label for="position" class="form-label">Position*</label>
            <select id="position" name="position" class="form-input">
                <option value="">Select a position</option>
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Backend Developer">Backend Developer</option>
                <option value="Full Stack Developer">Full Stack Developer</option>
                <option value="UI/UX Designer">UI/UX Designer</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="QA Engineer">QA Engineer</option>
            </select>
            <span class="error-msg" id="position-error"></span>

            <label for="joblevel" class="form-label">Job Level*</label>
            <select id="joblevel" name="joblevel" class="form-input">
                <option value="">Select a job level</option>
                <option value="Intern">Intern</option>
                <option value="Junior">Junior</option>
                <option value="Mid-Level">Mid-Level</option>
                <option value="Senior">Senior</option>
                <option value="Lead">Lead</option>
            </select>
            <span class="error-msg" id="joblevel-error"></span>

            <label for="experience" class="form-label">Experience (Years)*</label>
            <input
                type="number"
                id="experience"
                name="experience"
                class="form-input"
                placeholder="Enter your years of experience"
                min="0"
                max="30"
            >
            <span class="error-msg" id="experience-error"></span>

            <label for="skills" class="form-label">Skills*</label>
            <input
                type="text"
                id="skills"
                name="skills"
                class="form-input"
                placeholder="e.g. JavaScript, React, SQL"
            >
            <span class="error-msg" id="skills-error"></span>

            <label for="projects" class="form-label">Describe Your Projects*</label>
            <textarea
                id="projects"
                name="projects"
                class="form-input form-textarea"
                placeholder="Describe your key projects (minimum 50 characters)"
                rows="5"
            ></textarea>
            <span class="error-msg" id="projects-error"></span>

            <label for="resume" class="form-label">Resume Upload* (PDF or DOCX)</label>
            <input
                type="file"
                id="resume"
                name="resume"
                class="form-input form-file"
                accept=".pdf,.docx"
            >
            <span class="error-msg" id="resume-error"></span>

            <button type="submit" class="form-btn">
                Submit Application
            </button>

        </form>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
